<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VESNA</title>
  <meta name="description" content="VESNA — a gothic horror graphic novel." />
  <style>
    :root{
      --bg:#050505;
      --text:#ffffff;
      --muted:#b3b3b3;
      --button:#ffffff;
      --buttonText:#000000;
      --buttonBorder:#ffffff;
      --max:1120px;
      --content:960px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .hero{
      width:100%;
      background:#000;
    }

    .hero img{
      display:block;
      width:100%;
      height:auto;
      max-width:1920px;
      margin:0 auto;
    }

    .content{
      width:min(calc(100% - 32px), var(--max));
      margin:0 auto;
      padding:28px 0 60px;
      text-align:center;
    }

    .section{
      margin:0 auto 34px;
      width:min(100%, var(--content));
    }

    .video-wrap{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#111;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }

    .video-wrap iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .cover-wrap{
      padding-top:8px;
    }

    .cover{
      display:block;
      width:min(100%, 420px);
      height:auto;
      margin:0 auto;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .credits{
      margin:20px auto 0;
      font-size:14px;
      color:var(--muted);
      line-height:1.5;
      letter-spacing:.03em;
      text-transform:uppercase;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:14px;
      margin-top:6px;
    }

    .button{
      display:inline-block;
      padding:15px 24px;
      min-width:190px;
      border:1px solid var(--buttonBorder);
      background:var(--button);
      color:var(--buttonText);
      text-decoration:none;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
      transition:.15s ease;
    }

    .button:hover{
      background:transparent;
      color:var(--text);
    }

    .footer{
      margin-top:18px;
      color:#8f8f8f;
      font-size:12px;
      line-height:1.5;
    }

    @media (max-width:700px){
      .content{
        width:min(calc(100% - 20px), var(--max));
        padding-top:18px;
        padding-bottom:40px;
      }

      .section{margin-bottom:24px}

      .buttons{
        flex-direction:column;
        align-items:stretch;
      }

      .button{width:100%}

      .credits{font-size:12px}
    }
  </style>
</head>
<body>

  <section class="hero">
    <img src="vesna-banner.png" alt="VESNA — A Gothic Horror Graphic Novel" />
  </section>

  <main class="content">

    <section class="section">
      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/NqpB8Xr3CaA?si=qn1cshvfUcYketas"
          title="VESNA Trailer"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="section cover-wrap">
      <img class="cover" src="vesna-cover.jpg" alt="VESNA comic cover" />
      <div class="credits">
        Written by Jason Alacrity<br />
        Artwork by Megan Hutchison
      </div>
    </section>

    <section class="section">
      <div class="buttons">
        <!-- Replace # with your actual buy links -->
        <a class="button" href="#" target="_blank" rel="noopener">Buy Kindle</a>
        <a class="button" href="#" target="_blank" rel="noopener">Buy Paperback</a>
        <a class="button" href="#" target="_blank" rel="noopener">Signed Copy</a>
      </div>

      <div class="footer">© Inspired Revolution</div>
    </section>

  </main>
</body>
</html>
